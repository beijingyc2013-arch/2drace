


<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#18212b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>HIGHWAY DRIVE 8-BIT</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
height:100%;margin:0;background:#18212b;
font-family:monospace;overflow:hidden;color:white;
user-select:none;-webkit-user-select:none;
overscroll-behavior:none;touch-action:none
}
canvas{
display:block;position:fixed;inset:0;
width:100vw;height:100dvh;image-rendering:pixelated
}
#hud{
position:absolute;top:calc(10px + env(safe-area-inset-top));
left:calc(12px + env(safe-area-inset-left));
right:calc(12px + env(safe-area-inset-right));
display:flex;justify-content:space-between;gap:7px;
pointer-events:none
}
.stat{
background:#18212b;border:3px solid #8292a5;
padding:8px 11px;font-size:12px;font-weight:bold;
box-shadow:3px 3px #101923
}
#pause{
position:absolute;right:calc(12px + env(safe-area-inset-right));
top:calc(62px + env(safe-area-inset-top));
background:#263648;color:white;border:3px solid #8292a5;
padding:9px 14px;font-family:monospace;font-weight:bold;
box-shadow:3px 3px #101923
}
#controls{
position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));
left:calc(14px + env(safe-area-inset-left));
right:calc(14px + env(safe-area-inset-right));
display:flex;justify-content:space-between;pointer-events:none
}
.control{
pointer-events:auto;width:30vw;max-width:130px;height:68px;
background:#263648cc;color:white;border:3px solid #8292a5;
font-size:26px;font-weight:bold;touch-action:none;
font-family:monospace;box-shadow:4px 4px #101923
}
#overlay{
position:absolute;inset:0;display:flex;
align-items:center;justify-content:center;
background:#101923dc
}
.panel{
width:min(340px,90vw);padding:28px;
background:#202d3d;border:4px solid #8292a5;
text-align:center;box-shadow:8px 8px #080d13
}

font-size:25px;line-height:1.4;margin:0 0 20px;
letter-spacing:1px
}

width:100%;padding:14px;border:3px solid #8ecbff;

}

.hidden{display:none!important}
button{cursor:pointer}

transform:translate(2px,2px);
box-shadow:1px 1px #101923!important
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="stat">SCORE: <span id="score">0</span></div>
  <div class="stat"><span id="speed">0</span> KM/U</div>
  <div class="stat"><span id="distance">0</span> M</div>
</div>

<button id="pause" class="hidden">PAUZE</button>

<div id="controls" class="hidden">
  <button class="control" id="left">◀</button>
  <button class="control" id="right">▶</button>
</div>

<div id="overlay">
  <div class="panel">
    <h1 id="title">HIGHWAY DRIVE</h1>
    <div id="highscore">HIGHSCORE: <span id="best">0</span></div>
    <p id="message" class="hidden"></p>
    <button id="start">START</button>
    <p style="font-size:11px;margin:14px 0 0">
      ◀ + ▶ tegelijk = remmen
    </p>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);

const canvas=$("game");
const screenCtx=canvas.getContext("2d");

const buffer=document.createElement("canvas");
const ctx=buffer.getContext("2d");

const PIXEL_SIZE=3;
const LANES=5;
const K=2.4;

const carColors=[
  "#2878d0","#f5c542","#f5f5f5",
  "#17191d","#32a852","#9149c9",
  "#ed8b28","#19a9a0","#9299a2","#e66a9c"
];

let W,H,DPR,roadX,roadW,laneW;

let running=false;
let paused=false;
let debug=false;

let playT=0;
let score=0;
let distance=0;
let speed=120;
let roadOffset=0;
let spawnTimer=0;
let clock=0;
let lastTime=0;

let traffic=[];
let keys={};

let best=Number(localStorage.getItem("highwayBest")||0);

const player={
  lx:2,
  y:0,
  w:30,
  h:54,
  vx:0,
  ang:0,
  sig:0,
  braking:false,
  color:"#2878d0"
};

$("best").textContent=best;

const rand=(a,b)=>Math.random()*(b-a)+a;
const diff=()=>Math.min(1,playT/150);
const cruise=()=>85+50*diff();
const cx=v=>roadX+(v.lx+.5)*laneW;

/* =========================
   SCHERM
========================= */

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);

  W=innerWidth;
  H=innerHeight;

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  buffer.width=Math.ceil(W/PIXEL_SIZE);
  buffer.height=Math.ceil(H/PIXEL_SIZE);

  ctx.setTransform(
    buffer.width/W,0,0,
    buffer.height/H,0,0
  );

  screenCtx.setTransform(DPR,0,0,DPR,0,0);

  roadW=Math.min(W*.84,LANES*66);
  roadX=(W-roadW)/2;
  laneW=roadW/LANES;

  player.w=laneW*.56;
  player.h=player.w*1.8;
  player.y=H*.68;
}

addEventListener("resize",resize);
resize();

/* =========================
   WEG
========================= */

function drawRoad(){

  ctx.fillStyle="#397c3e";
  ctx.fillRect(0,0,W,H);

  for(let i=0;i<30;i++){
    const y=(i*83+roadOffset*1.5)%H;

    ctx.fillStyle=i%2?"#438c46":"#347239";

    ctx.fillRect(roadX-35,y,15,5);
    ctx.fillRect(roadX+roadW+20,y+25,13,5);
  }

  ctx.fillStyle="#b9b9b9";
  ctx.fillRect(roadX-10,0,roadW+20,H);

  ctx.fillStyle="#45494f";
  ctx.fillRect(roadX,0,roadW,H);

  ctx.fillStyle="#f5f5f5";

  ctx.fillRect(roadX+4,0,3,H);
  ctx.fillRect(roadX+roadW-7,0,3,H);

  for(let i=1;i<LANES;i++){
    const x=roadX+i*laneW;

    for(let y=-75+roadOffset;y<H;y+=75){
      ctx.fillRect(x-1.5,y,3,38);
    }
  }
}

/* =========================
   AUTO DETAILS
========================= */

function lights(v,x,y,w,h){

  ctx.fillStyle="#fff5c5";

  ctx.fillRect(x+2,y+1,5,4);
  ctx.fillRect(x+w-7,y+1,5,4);

  ctx.fillStyle=v.braking?"#ff7070":"#a81818";

  ctx.fillRect(x+2,y+h-5,6,4);
  ctx.fillRect(x+w-8,y+h-5,6,4);

  if(v.braking){
    ctx.fillStyle="#ff3030";
    ctx.fillRect(x+w/2-3,y+h-4,6,2);
  }

  if(v.sig&&Math.floor(clock*3)%2===0){
    ctx.fillStyle="#ffa81c";

    const sx=v.sig<0?x-3:x+w-1;

    ctx.fillRect(sx,y+1,4,5);
    ctx.fillRect(sx,y+h-6,4,5);
  }
}

function aggro(v,x,y,w,h){

  if(!v.aggressive)return;

  ctx.fillStyle="#ff3030";

  ctx.fillRect(x-3,y-3,w+6,3);
  ctx.fillRect(x-3,y+h,w+6,3);

  ctx.fillRect(x-3,y-3,3,h+6);
  ctx.fillRect(x+w,y-3,3,h+6);
}

function drawCar(v){

  const w=v.w;
  const h=v.h;
  const x=-w/2;
  const y=-h/2;
  const c=v.color;

  ctx.fillStyle="#252525";
  ctx.fillRect(x+3,y+4,w,h);

  ctx.fillStyle="#101010";

  for(const f of[.17,.65]){
    ctx.fillRect(x-3,y+h*f,5,h*.2);
    ctx.fillRect(x+w-2,y+h*f,5,h*.2);
  }

  ctx.fillRect(x-2,y-2,w+4,h+4);

  ctx.fillStyle=c;
  ctx.fillRect(x,y,w,h);

  ctx.fillStyle="#a9d4e8";

  ctx.fillRect(x+3,y+h*.27,w-6,h*.18);
  ctx.fillRect(x+3,y+h*.6,w-6,h*.15);

  ctx.fillStyle="#30343a";
  ctx.fillRect(x+3,y+h-3,w-6,2);

  lights(v,x,y,w,h);
  aggro(v,x,y,w,h);
}

function drawTruck(v){

  const w=v.w;
  const h=v.h;
  const x=-w/2;
  const y=-h/2;
  const cab=h*.27;

  ctx.fillStyle="#252525";
  ctx.fillRect(x+4,y+5,w,h);

  ctx.fillStyle="#101010";

  for(const f of[.12,.62,.8]){
    ctx.fillRect(x-3,y+h*f,5,h*.12);
    ctx.fillRect(x+w-2,y+h*f,5,h*.12);
  }

  ctx.fillRect(x-2,y-2,w+4,h+4);

  ctx.fillStyle=v.color;
  ctx.fillRect(x,y+cab,w,h-cab);

  ctx.fillStyle="#fff";

  for(const f of[.38,.58,.78]){
    ctx.fillRect(x+4,y+h*f,w-8,3);
  }

  ctx.fillStyle="#e8e8e8";
  ctx.fillRect(x,y,w,cab);

  ctx.fillStyle="#a9d4e8";
  ctx.fillRect(x+3,y+cab*.3,w-6,cab*.4);

  ctx.fillStyle="#101010";
  ctx.fillRect(x,y+cab-1,w,2);

  lights(v,x,y,w,h);
  aggro(v,x,y,w,h);
}

function drawV(v){

  ctx.save();

  ctx.translate(cx(v),v.y+v.h/2);
  ctx.rotate(v.ang);

  v.truck?drawTruck(v):drawCar(v);

  ctx.restore();
}

/* =========================
   HITBOXES
========================= */

function corners(v,sx,sy){

  const c=cx(v);
  const m=v.y+v.h/2;

  const hw=v.w/2*sx;
  const hh=v.h/2*sy;

  const co=Math.cos(v.ang);
  const si=Math.sin(v.ang);

  return[
    [-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]
  ].map(p=>[
    c+p[0]*co-p[1]*si,
    m+p[0]*si+p[1]*co
  ]);
}

function sat(A,B){

  for(const P of[A,B]){
    for(let i=0;i<4;i++){

      const p=P[i];
      const q=P[(i+1)%4];

      const nx=q[1]-p[1];
      const ny=p[0]-q[0];

      let a0=Infinity;
      let a1=-Infinity;
      let b0=Infinity;
      let b1=-Infinity;

      for(const c of A){
        const d=c[0]*nx+c[1]*ny;
        a0=Math.min(a0,d);
        a1=Math.max(a1,d);
      }

      for(const c of B){
        const d=c[0]*nx+c[1]*ny;
        b0=Math.min(b0,d);
        b1=Math.max(b1,d);
      }

      if(a1<b0||b1<a0)return false;
    }
  }

  return true;
}

function drawHitbox(v){

  const c=corners(v,.9,.94);

  ctx.strokeStyle="#00ff66";
  ctx.lineWidth=1.5;

  ctx.beginPath();
  ctx.moveTo(c[0][0],c[0][1]);

  for(let i=1;i<4;i++){
    ctx.lineTo(c[i][0],c[i][1]);
  }

  ctx.closePath();
  ctx.stroke();
}

/* =========================
   VERKEERSLOGICA
========================= */

function dims(v){
  v.w=laneW*v.wf;
  v.h=v.w*v.ratio;
}

function laneOverlap(a,b){

  // Werkelijke horizontale afstand
  const dx=Math.abs(cx(a)-cx(b));

  // Inclusief een kleine veiligheidsmarge
  return dx<(a.w+b.w)/2+7;
}

function occupiedLane(v,L){

  return (
    Math.abs(v.lx-L)<.9 ||
    v.lane===L ||
    v.targetLane===L
  );
}

function safe(v,L){

  for(const o of traffic.concat([player])){

    if(o===v)continue;

    if(o===player){
      if(Math.abs(o.lx-L)>.85)continue;
    }else{
      if(!occupiedLane(o,L))continue;
    }

    const verticalGap=Math.abs(
      (v.y+v.h/2)-(o.y+o.h/2)
    );

    const minDistance=(v.h+o.h)/2+55;

    if(verticalGap<minDistance)return false;
  }

  return true;
}

function ahead(v,L){

  let result={
    gap:Infinity,
    speed:999,
    object:null
  };

  for(const o of traffic){

    if(o===v)continue;
    if(!occupiedLane(o,L))continue;
    if(o.y>=v.y)continue;

    const g=v.y-(o.y+o.h);

    if(g<result.gap){
      result={
        gap:g,
        speed:o.speed,
        object:o
      };
    }
  }

  return result;
}

function startSignal(v,L){

  v.targetLane=L;
  v.dir=Math.sign(L-v.lane);
  v.state="signal";
  v.timer=v.aggressive?.5:1.4;
}

function decide(v,lead,gap){

  const fd=30+v.speed*.6;

  const blocked=
    lead &&
    gap<fd*2.5 &&
    lead.speed<v.desired-6;

  let want=null;

  if(blocked){

    // Eerst links proberen
    for(const L of[v.lane-1,v.lane+1]){

      if(L<0||L>=LANES)continue;
      if(!safe(v,L))continue;

      const a=ahead(v,L);

      if(a.gap>gap+80||a.speed>=v.desired-6){
        want=L;
        break;
      }
    }

  }else if(v.lane!==v.home){

    const L=v.lane+Math.sign(v.home-v.lane);

    if(safe(v,L)){
      const a=ahead(v,L);

      if(a.speed>=v.desired-6||a.gap>200){
        want=L;
      }
    }
  }

  if(want!==null){
    startSignal(v,want);
  }else{
    v.cool=rand(.4,.9);
  }
}

/* =========================
   AUTO'S SPAWNEN
========================= */

function spawn(){

  const d=diff();

  const truck=Math.random()<.08+.08*d;

  const ag=
    !truck &&
    Math.random()<.04+.26*d;

  const back=
    speed<80 &&
    Math.random()<.6;

  const wf=truck?.62:.56;
  const ratio=truck?2.8:1.8;

  const lanes=[...Array(LANES).keys()]
    .sort(()=>Math.random()-.5);

  for(const L of lanes){

    // Controleer de volledige spawnzone
    const blocked=traffic.some(o=>{

      const same=
        occupiedLane(o,L);

      if(!same)return false;

      return back
        ?o.y>H-260
        :o.y<190;
    });

    if(blocked)continue;

    const desired=back
      ?rand(58,85)
      :truck
        ?rand(38,55)
        :ag
          ?rand(70,88)
          :rand(48,75);

    const v={
      lx:L,
      lane:L,
      home:L,
      targetLane:null,

      y:0,
      wf,
      ratio,
      w:0,
      h:0,

      ang:0,
      sig:0,
      dir:0,

      color:ag
        ?"#e02020"
        :carColors[Math.floor(Math.random()*carColors.length)],

      truck,
      aggressive:ag,

      speed:desired,
      desired,

      state:"cruise",
      timer:0,
      cool:rand(2,5),

      braking:false
    };

    dims(v);

    v.y=back?H+30:-v.h-20;

    traffic.push(v);
    return;
  }
}

/* =========================
   VERKEER UPDATEN
========================= */

function updateTraffic(dt){

  spawnTimer-=dt;

  if(spawnTimer<=0){
    spawn();
    spawnTimer=(1.3-.7*diff())*rand(.8,1.2);
  }

  // Auto's van boven naar beneden verwerken.
  // De voorligger is daardoor al bijgewerkt.
  traffic.sort((a,b)=>a.y-b.y);

  for(const v of traffic){

    dims(v);

    // Zoek de dichtstbijzijnde voorligger
    let lead=null;
    let gap=Infinity;

    for(const o of traffic){

      if(o===v)continue;
      if(o.y>=v.y)continue;

      if(!laneOverlap(v,o))continue;

      const g=v.y-(o.y+o.h);

      if(g<gap){
        gap=g;
        lead=o;
      }
    }

    // Speler als voorligger
    const playerObj={
      lx:player.lx,
      y:player.y,
      h:player.h,
      w:player.w,
      speed:speed,
      ang:player.ang
    };

    if(playerObj.y<v.y && laneOverlap(v,playerObj)){

      const g=v.y-(playerObj.y+playerObj.h);

      if(g<gap){
        gap=g;
        lead=playerObj;
      }
    }

    // Gewenste snelheid
    let target=v.desired;

    if(lead){

      const safeGap=35+v.speed*.8;
      const brakingGap=safeGap*3;

      if(gap<brakingGap){

        const factor=Math.max(
          0,
          Math.min(
            1,
            (brakingGap-gap)/(brakingGap-safeGap)
          )
        );

        const closing=Math.max(
          0,
          v.speed-lead.speed
        );

        target=Math.min(
          target,
          lead.speed-closing*factor*.8
        );
      }

      if(gap<safeGap){
        target=Math.min(target,lead.speed);
      }

      if(gap<0){
        target=Math.min(target,lead.speed-5);
      }
    }

    target=Math.max(0,target);

    // Geleidelijk remmen
    v.braking=v.speed>target+2;

    if(v.speed>target){
      v.speed=Math.max(
        target,
        v.speed-75*dt
      );
    }else{
      v.speed=Math.min(
        target,
        v.speed+8*dt
      );
    }

    // Bereken normale beweging
    const movement=(speed-v.speed)*K*dt;

    let nextY=v.y+movement;

    // BELANGRIJK:
    // Nooit door de voorligger heen bewegen.
    // Geen teleportatie naar een andere positie.
    if(lead){

      const minimumGap=12;
      const minimumY=lead.y+lead.h+minimumGap;

      if(v.y>=minimumY){

        nextY=Math.max(nextY,minimumY);

      }else{

        // Als er al overlap bestaat:
        // geen verdere beweging richting de voorligger.
        nextY=Math.max(nextY,v.y);
      }
    }

    v.y=nextY;

    // Rijstrookwisselingen
    if(v.state==="cruise"){

      v.cool-=dt;

      if(v.cool<=0){
        decide(v,lead,gap);
      }

    }else if(v.state==="signal"){

      v.timer-=dt;

      if(v.timer<=0){

        if(safe(v,v.targetLane)){
          v.state="change";
        }else{

          v.state="cruise";
          v.targetLane=null;
          v.dir=0;
          v.cool=3;
        }
      }

    }else if(v.state==="change"){

      const rate=v.aggressive?1.3:.9;
      const d=v.targetLane-v.lx;

      // Beweging naar andere baan
      const nextLX=
        v.lx+
        Math.sign(d)*Math.min(Math.abs(d),rate*dt);

      // Controleer of de nieuwe positie veilig is
      const oldLX=v.lx;

      v.lx=nextLX;

      let collision=false;

      for(const o of traffic){

        if(o===v)continue;

        if(Math.abs(o.y-v.y)>(o.h+v.h)/2+15)continue;

        if(laneOverlap(v,o)){
          collision=true;
          break;
        }
      }

      // Speler ook controleren
      if(
        Math.abs(player.y-v.y)<(player.h+v.h)/2+15 &&
        laneOverlap(v,player)
      ){
        collision=true;
      }

      if(collision){

        // Rijstrookwissel stoppen
        v.lx=oldLX;
        v.state="cruise";
        v.targetLane=null;
        v.dir=0;
        v.cool=2;

      }else if(Math.abs(v.targetLane-v.lx)<.01){

        v.lx=v.targetLane;
        v.lane=v.targetLane;
        v.targetLane=null;
        v.dir=0;
        v.state="cruise";

        v.cool=v.aggressive
          ?rand(3,5)
          :rand(6,10);
      }
    }

    // Richtingaanwijzers
    v.sig=v.state==="cruise"?0:v.dir;

    // Kanteling
    const tilt=v.state==="change"
      ?v.dir*(v.aggressive?1.3:.9)*.09
      :0;

    v.ang+=(tilt-v.ang)*Math.min(1,dt*8);
  }

  // Verwijder auto's buiten beeld
  traffic=traffic.filter(
    v=>v.y<H+150&&v.y>-500
  );
}

/* =========================
   SPELER
========================= */

function update(dt){

  if(!running||paused)return;

  const L=
    keys.ArrowLeft||
    keys.a||
    keys.A;

  const R=
    keys.ArrowRight||
    keys.d||
    keys.D;

  const brake=!!(L&&R);

  player.braking=brake;

  playT+=dt;

  if(brake){
    speed=Math.max(3,speed-90*dt);
  }else{
    speed=Math.min(cruise(),speed+60*dt);
  }

  const dir=brake
    ?0
    :(R?1:0)-(L?1:0);

  player.vx+=(
    dir*3.2*Math.min(1,speed/40)-player.vx
  )*Math.min(1,dt*9);

  player.lx+=player.vx*dt;

  const m=(10+player.w/2)/laneW-.5;
  const lo=m;
  const hi=LANES-1-m;

  if(player.lx<lo){
    player.lx=lo;
    player.vx=0;
  }

  if(player.lx>hi){
    player.lx=hi;
    player.vx=0;
  }

  player.ang=player.vx*.04;
  player.sig=dir;

  updateTraffic(dt);

  // Botsingsdetectie
  const pc=corners(player,.82,.92);

  for(const v of traffic){

    if(sat(pc,corners(v,.9,.94))){
      endGame();
      return;
    }
  }

  distance+=speed*dt/3.6;
  score=Math.floor(distance/5);
}

/* =========================
   TEKENEN
========================= */

function draw(){

  ctx.clearRect(0,0,W,H);

  drawRoad();

  for(const v of traffic){
    drawV(v);
  }

  if(running){
    drawV(player);
  }

  if(debug){

    for(const v of traffic){
      drawHitbox(v);
    }

    drawHitbox(player);
  }

  screenCtx.imageSmoothingEnabled=false;

  screenCtx.clearRect(0,0,W,H);

  screenCtx.drawImage(buffer,0,0,W,H);

  $("score").textContent=score;
  $("speed").textContent=Math.round(speed);
  $("distance").textContent=Math.floor(distance);
}

/* =========================
   GAME LOOP
========================= */

function loop(t){

  const dt=Math.min(
    (t-lastTime)/1000||0,
    .04
  );

  lastTime=t;
  clock+=dt;

  // De weg beweegt alleen tijdens het spelen
  if(running&&!paused){
    roadOffset=(roadOffset+speed*K*dt)%75;
  }

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

let wake=null;

async function keepAwake(){

  try{

    if("wakeLock"in navigator){
      wake=await navigator.wakeLock.request("screen");
    }

  }catch(e){}
}

/* =========================
   START / STOP
========================= */

function startGame(){

  score=0;
  distance=0;
  speed=80;
  playT=0;

  traffic=[];
  spawnTimer=.5;

  roadOffset=0;

  paused=false;
  running=true;

  player.lx=(LANES-1)/2;
  player.vx=0;
  player.ang=0;
  player.sig=0;
  player.braking=false;

  $("overlay").style.display="none";

  $("pause").classList.remove("hidden");
  $("controls").classList.remove("hidden");

  keepAwake();
}

function endGame(){

  running=false;
  paused=false;

  if(navigator.vibrate){
    navigator.vibrate(120);
  }

  if(score>best){

    best=score;

    localStorage.setItem(
      "highwayBest",
      best
    );
  }

  $("title").textContent="GAME OVER";

  $("highscore").textContent=
    "HIGHSCORE: "+best;

  $("message").innerHTML=
    "Score: <b>"+score+
    "</b><br>Afstand: <b>"+
    Math.floor(distance)+
    " meter</b>";

  $("message").classList.remove("hidden");

  $("start").textContent="OPNIEUW";

  $("overlay").style.display="flex";

  $("pause").classList.add("hidden");
  $("controls").classList.add("hidden");
}

function togglePause(){

  if(!running)return;

  paused=!paused;

  if(paused){

    $("title").textContent="GEPAUZEERD";

    $("highscore").textContent=
      "SCORE: "+score;

    $("message").classList.add("hidden");

    $("start").textContent="VERDER";

    $("overlay").style.display="flex";

  }else{

    $("overlay").style.display="none";
  }
}

/* =========================
   BEDIENING
========================= */

$("start").addEventListener("click",()=>{

  if(paused){

    paused=false;
    $("overlay").style.display="none";

  }else{

    $("message").classList.add("hidden");

    $("title").textContent="HIGHWAY DRIVE";

    $("highscore").textContent=
      "HIGHSCORE: "+best;

    $("start").textContent="START";

    startGame();
  }
});

$("pause").addEventListener(
  "click",
  togglePause
);

function holdButton(id,key){

  const b=$(id);

  b.addEventListener("pointerdown",e=>{

    e.preventDefault();

    keys[key]=true;

    b.setPointerCapture(e.pointerId);
  });

  const rel=()=>{
    keys[key]=false;
  };

  b.addEventListener("pointerup",rel);
  b.addEventListener("pointercancel",rel);
  b.addEventListener("lostpointercapture",rel);
}

holdButton("left","ArrowLeft");
holdButton("right","ArrowRight");

addEventListener("keydown",e=>{

  keys[e.key]=true;

  if([
    "ArrowLeft",
    "ArrowRight",
    "ArrowUp",
    "ArrowDown",
    " "
  ].includes(e.key)){
    e.preventDefault();
  }

  if(e.key==="Escape"||e.key==="p"||e.key==="P"){
    togglePause();
  }

  if(e.key==="h"||e.key==="H"){
    debug=!debug;
  }
});

addEventListener("keyup",e=>{
  keys[e.key]=false;
});

document.addEventListener("visibilitychange",()=>{

  if(document.hidden){

    if(running&&!paused){
      togglePause();
    }

  }else if(running){

    keepAwake();
  }
});

document.addEventListener(
  "contextmenu",
  e=>e.preventDefault()
);

/* =========================
   PWA
========================= */

if("serviceWorker"in navigator){

  addEventListener("load",()=>{

    navigator.serviceWorker
      .register("service-worker.js")
      .catch(()=>{});

  });
}

requestAnimationFrame(loop);

</script>
